name: Build Android APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode Signing Keystore
        if: "${{ secrets.SIGNING_KEY_BASE64 != '' }}"
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.SIGNING_KEY_BASE64 }}" | base64 -d > android/keystore/upload-keystore.jks

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --info > build-apk.log 2>&1 || (cat build-apk.log && exit 1)

      - name: Build Release AAB
        if: "${{ secrets.SIGNING_KEY_BASE64 != '' }}"
        working-directory: android
        env:
          KEYSTORE_PATH: keystore/upload-keystore.jks
          KEYSTORE_PASSWORD: "${{ secrets.KEYSTORE_PASSWORD }}"
          KEY_ALIAS: "${{ secrets.KEY_ALIAS }}"
          KEY_PASSWORD: "${{ secrets.KEY_PASSWORD }}"
        run: |
          gradle bundleRelease --stacktrace --info > build-aab.log 2>&1 || (cat build-aab.log && exit 1)

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keiba-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release AAB (Play Store)
        if: "${{ secrets.SIGNING_KEY_BASE64 != '' }}"
        uses: actions/upload-artifact@v4
        with:
          name: keiba-v2-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/*.log
