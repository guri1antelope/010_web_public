name: Build Android APK and AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Decode Signing Keystore
        env:
          KEY_DATA: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_DATA" ]; then
            mkdir -p android/keystore
            echo "$KEY_DATA" | base64 -d > android/keystore/upload-keystore.jks
          fi

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --info > build-apk.log 2>&1 || (cat build-apk.log && exit 1)

      - name: Build Release AAB
        working-directory: android
        env:
          KEY_DATA: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: keystore/upload-keystore.jks
        run: |
          if [ -n "$KEY_DATA" ]; then
            gradle bundleRelease --stacktrace --info > build-aab.log 2>&1 || (cat build-aab.log && exit 1)
          else
            echo "Signing key not found in Secrets. Skipping Release AAB build."
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: keiba-v2-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Check AAB Output
        id: check_aab
        run: |
          if [ -f "android/app/build/outputs/bundle/release/app-release.aab" ]; then
            echo "aab_exists=true" >> $GITHUB_OUTPUT
          else
            echo "aab_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Release AAB (Play Store)
        if: steps.check_aab.outputs.aab_exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: keiba-v2-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/*.log
